name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install libcurl (required to build the leancurl dependency's C shim)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libcurl4-openssl-dev
      - uses: leanprover/lean-action@v1

  # LLMClient.Fetch imports Lasm.Web, so only Lasm can build it, and the job above never does.
  lasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/lasm/package-lock.json
      - run: npm ci
        working-directory: test/lasm
      - run: npm test
        working-directory: test/lasm
