name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install libcurl (required to build the leancurl dependency's C shim)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libcurl4-openssl-dev
      - uses: leanprover/lean-action@v1
